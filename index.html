<style>
/* Layout: app de uma coluna para o polegar — marca e título no topo, candidato em faixa rolável, abas fixas no rodapé, uma vista por vez */
:root{
  --bg:#f3f4ee; --surface:#ffffff; --surface-2:#eceee5;
  --ink:#12140f; --ink-2:#3f4239; --muted:#64675d; --grid:#e1e3d9; --axis:#c3c5b9; --border:rgba(18,20,15,.12);
  --brand:#536e20; --brand-ink:#ffffff; --brand-wash:rgba(83,110,32,.10);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --tie:#a3a59a;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --nav-h:64px; --tile-filter:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f100d; --surface:#1a1b18; --surface-2:#252621;
    --ink:#f5f5f0; --ink-2:#d0cfc5; --muted:#9a9c91; --grid:#2d2e2a; --axis:#44453f; --border:rgba(255,255,255,.11);
    --brand:#a6c45c; --brand-ink:#0f100d; --brand-wash:rgba(166,196,92,.14);
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --tie:#6c6e66;
    --tile-filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f100d; --surface:#1a1b18; --surface-2:#252621;
  --ink:#f5f5f0; --ink-2:#d0cfc5; --muted:#9a9c91; --grid:#2d2e2a; --axis:#44453f; --border:rgba(255,255,255,.11);
  --brand:#a6c45c; --brand-ink:#0f100d; --brand-wash:rgba(166,196,92,.14);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --tie:#6c6e66;
  --tile-filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.55); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit}
a{color:var(--brand)}
.shell{max-width:640px;margin:0 auto;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 20px)}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:1000;background:var(--bg);border-bottom:1px solid var(--border)}
.topbar{display:flex;align-items:center;gap:12px;padding-inline:16px;padding-block:12px 8px}
.ttl{min-width:0;display:flex;flex-direction:column}
.ttl h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.1;letter-spacing:-.01em}
.ttl span{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-inline:16px;padding-block:4px 12px;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;box-sizing:border-box;cursor:pointer;flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:9px;padding:8px 14px 8px 11px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);min-height:46px}
.chip .d{width:12px;height:12px;border-radius:50%;flex:none}
.chip .l{display:flex;flex-direction:column;line-height:1.15}
.chip .l b{font-size:14.5px;font-weight:700}
.chip .l small{font-size:11.5px;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .l small{color:var(--bg);opacity:.75}
.chip[aria-pressed="true"] .d{box-shadow:0 0 0 2px var(--bg)}
.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* vistas */
main{padding-inline:16px;padding-block:16px 8px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px}
h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1.2;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:700}
p{margin:0}
.sub{font-size:14px;color:var(--muted)}
.vh{display:flex;flex-direction:column;gap:2px}

.hero{display:flex;flex-direction:column;gap:8px}
.hero .who{display:flex;align-items:center;gap:10px}
.hero .who i{width:14px;height:14px;border-radius:50%;flex:none}
.hero .who b{font-size:19px}
.hero .who small{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.hero .big{font-size:52px;font-weight:700;line-height:1;letter-spacing:-.02em}
.hero .big small{display:block;font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-top:4px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;font-size:13px;font-weight:600;border-radius:999px;padding:4px 11px;background:var(--surface-2);color:var(--ink-2)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--surface-2);border-radius:12px;padding:10px;min-width:0}
.fact b{display:block;font-size:18px;font-weight:700;line-height:1.2}
.fact span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.3;margin-top:2px}

.rank{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.rrow{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 4px;border-radius:10px}
.rrow:focus-visible{outline:2px solid var(--brand)}
.rrow .nm{display:flex;flex-direction:column;min-width:0}
.rrow .nm b{display:flex;align-items:center;gap:8px;font-size:15.5px}
.rrow .nm b i{width:11px;height:11px;border-radius:50%;flex:none}
.rrow .nm small{font-size:12.5px;color:var(--muted);padding-left:19px}
.rrow .val{text-align:right;font-variant-numeric:tabular-nums}
.rrow .val b{display:block;font-size:17px}
.rrow .val small{font-size:12.5px;color:var(--muted)}
.track{grid-column:1 / -1;height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.track span{display:block;height:100%;border-radius:999px}
.rrow.on{background:var(--brand-wash)}

.strip{display:flex;gap:2px;height:22px;margin-top:10px}
.strip span{height:100%;min-width:4px}
.strip span:first-child{border-radius:5px 0 0 5px}
.strip span:last-child{border-radius:0 5px 5px 0}
.leg{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:14px;color:var(--ink-2)}
.leg span{display:flex;align-items:center;gap:8px}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.leg b{color:var(--ink);font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right}

details.more{margin-top:8px;border-top:1px solid var(--grid);padding-top:12px}
details.more summary{cursor:pointer;font-weight:700;font-size:14.5px;color:var(--brand);list-style:none;min-height:32px;display:flex;align-items:center}
details.more summary::-webkit-details-marker{display:none}
ol.top10{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:14.5px}
ol.top10 li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--grid)}
ol.top10 li span:last-child{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
ol.top10 li.sel span:first-child{font-weight:700}

.link-card{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px}
.link-card:focus-visible{outline:2px solid var(--brand)}
.link-card .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.link-card .tx b{font-size:15.5px}
.link-card .tx span{font-size:13px;color:var(--muted)}
.link-card .ar{font-size:22px;color:var(--brand)}

.notes{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-2)}

/* mapa */
.seg{display:inline-flex;gap:2px;background:var(--surface-2);border-radius:11px;padding:3px}
.seg button{all:unset;cursor:pointer;font-size:14px;font-weight:700;padding:9px 14px;border-radius:9px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--border)}
.seg button:focus-visible{outline:2px solid var(--brand)}
.mapwrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:var(--surface-2)}
#map{height:min(64vh,560px);min-height:340px;width:100%;background:var(--surface-2)}
.leaflet-tile-pane{filter:var(--tile-filter)}
.leaflet-container{font-family:var(--font-body)}
.leaflet-control-attribution{font-size:10.5px}
.map-note{position:absolute;left:10px;right:10px;bottom:28px;z-index:500;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--ink-2)}
.maptools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.legend-map{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.legend-map i{width:12px;height:12px;border-radius:50%;flex:none}

/* listas */
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools > *{flex:1 1 150px;min-width:0}
select,input[type="search"]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;min-height:48px;width:100%}
select:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.item > button{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:14px 16px;width:100%;box-sizing:border-box;align-items:center}
.item > button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.item .t{font-weight:700;font-size:15.5px;min-width:0;line-height:1.3}
.item .s{font-size:13px;color:var(--muted);grid-column:1}
.item .r{grid-row:1 / span 2;grid-column:2;text-align:right;font-variant-numeric:tabular-nums}
.item .r b{display:block;font-size:20px;font-weight:700;line-height:1.1}
.item .r span{font-size:13px;color:var(--muted)}
.item .bar{display:block;position:relative;grid-column:1 / -1;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:8px}
.item .bar span.f{position:absolute;left:0;top:0;bottom:0;display:block;border-radius:999px}
.item .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.item.open{border-color:var(--axis)}
.mini{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:10px;align-items:center;font-size:14.5px;padding:7px 0;border-bottom:1px solid var(--grid)}
.mrow:last-child{border-bottom:0}
.mrow .n{display:flex;align-items:center;gap:8px;min-width:0}
.mrow .n i{width:10px;height:10px;border-radius:50%;flex:none}
.mrow .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mrow .p{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.mrow.on .n span{font-weight:700}
.leadline{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.leadline i{width:10px;height:10px;border-radius:50%}
.btn{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--brand-ink);background:var(--brand);border-radius:12px;padding:12px 16px;min-height:48px;text-align:center}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--border)}
.count{font-size:14px;color:var(--ink-2)}
.empty{padding:20px;color:var(--muted);font-size:15px;text-align:center}

/* abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--brand)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.3}
nav.tabs button:focus-visible{outline:2px solid var(--brand);outline-offset:-5px;border-radius:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

    const d = el('span',{class:'d'}); d.style.background = c.color;
    b.append(d, el('span',{class:'l'}, el('b',{text:c.short}), el('small',{text:`${c.party} · ${c.num}`})));
    b.addEventListener('click', () => { state.c = c.key; state.mapSel=''; save(); renderAll(); });
    box.append(b);
  }
  const on = box.querySelector('[aria-pressed="true"]'); if (on) box.scrollLeft = Math.max(0, on.offsetLeft - 16);
}

// resumo
function renderHero(){
  const c = C(), box = $('#hero'); box.replaceChildren();
  box.append(el('div',{class:'who'}, dot(c.color,14), el('b',{text:c.name}), el('small',{text:`${c.party} · ${c.num}`})));
  const big = el('div',{class:'big'}); big.append(document.createTextNode(nf.format(TOT[c.key])), el('small',{text:`votos em Igarassu · ${pf(TOT[c.key]/TOT.val)} dos válidos`}));
  box.append(big);
  const pills = el('div',{class:'pills'});
  if (c.rank) pills.append(el('span',{class:'pill', text:`${c.rank}º mais votado no município`}));
  pills.append(el('span',{class:'pill', text:`${c.sit} em PE`}));
  box.append(pills);
  const lead = SEC.filter(s => leader(s).key===c.key).length;
  box.append(el('div',{class:'facts'},
    el('div',{class:'fact'}, el('b',{text:nf.format(c.pe)}), el('span',{text:'votos em todo o estado'})),
    el('div',{class:'fact'}, el('b',{text:pf1(TOT[c.key]/c.pe)}), el('span',{text:'desses votos vieram de Igarassu'})),
    el('div',{class:'fact'}, el('b',{text:String(lead)}), el('span',{text:`seções em que liderou entre os ${NW}`}))
  ));
}
function renderRank(){
  $('#rankTitle').textContent = `Os ${NW} candidatos em Igarassu`;
  const box = $('#rank'); box.replaceChildren();
  const max = Math.max(...CANDS.map(c=>TOT[c.key]));
  for (const c of [...CANDS].sort((a,b)=>TOT[b.key]-TOT[a.key])){
    const b = el('button',{class:'rrow' + (c.key===state.c ? ' on' : ''), type:'button', 'aria-pressed':String(c.key===state.c)});
    b.append(el('span',{class:'nm'}, el('b',{}, dot(c.color,11), document.createTextNode(c.short)), el('small',{text:`${c.party} · ${c.sit}`})));
    b.append(el('span',{class:'val'}, el('b',{text:nf.format(TOT[c.key])}), el('small',{text:pf(TOT[c.key]/TOT.val)})));
    const tr = el('span',{class:'track'}); const f = el('span'); f.style.width = (100*TOT[c.key]/max)+'%'; f.style.background = c.color; tr.append(f); b.append(tr);
    b.addEventListener('click', () => { state.c = c.key; save(); renderAll(); window.scrollTo({top:0, behavior:'smooth'}); });
    box.append(b);
  }
  $('#top10Sum').textContent = `Ver os 10 mais votados para ${CFG.cargo} em Igarassu`;
  const ol = $('#top10'); ol.replaceChildren();
  CFG.top10.forEach((t,i) => ol.append(el('li',{class: CANDS.some(c=>c.num===t[0]) ? 'sel' : ''}, el('span',{text:`${i+1}. ${t[1]} (${t[2]})`}), el('span',{text:nf.format(t[3])}))));
  $('#selNote').textContent = CFG.selNote || '';
  $('#selNote').hidden = !CFG.selNote;
}
function renderStrip(host, legend, title, items, unit){
  $(title).textContent = `Quem liderou entre os ${NW}, por ${unit}`;
  const H = $(host), L = $(legend); H.replaceChildren(); L.replaceChildren();
  const counts = new Map(); for (const it of items){ const k = leader(it).key; counts.set(k,(counts.get(k)||0)+1); }
  const order = [...CANDS, TIE].filter(c=>counts.get(c.key)).sort((a,b)=>counts.get(b.key)-counts.get(a.key));
  for (const c of order){ const n = counts.get(c.key); const s = el('span'); s.style.flex = `${n} 0 0`; s.style.background = c.color; H.append(s); const l = el('span'); const i = el('i'); i.style.background = c.color; l.append(i, el('b',{text:String(n)}), document.createTextNode(c.key==='emp' ? ' empates' : ` ${c.short}`)); L.append(l); }
  H.setAttribute('role','img'); H.setAttribute('aria-label', order.map(c=>`${c.short}: ${counts.get(c.key)}`).join(', '));
}

// mapa (Leaflet + OpenStreetMap)
const URB = [[-7.889,-34.933],[-7.802,-34.891]];
let map = null, layer = null, tilesOk = 0, tilesErr = 0, mapView = 'urb';
function initMap(){
  if (map || typeof L === 'undefined') return;
  map = L.map('map', {zoomControl:true, attributionControl:true, scrollWheelZoom:false, tap:true});
  map.attributionControl.setPrefix(false);
  const t = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'});
  t.on('tileload', () => { tilesOk++; $('#mapNote').hidden = true; });
  t.on('tileerror', () => { tilesErr++; if (!tilesOk && tilesErr >= 3) { $('#mapNote').textContent = 'As ruas do OpenStreetMap não carregaram nesta visualização. Os círculos continuam corretos; abra o site pelo endereço público para ver o mapa completo.'; $('#mapNote').hidden = false; } });
  t.addTo(map);
  layer = L.layerGroup().addTo(map);
  map.fitBounds(URB, {padding:[10,10]});
}
function renderMap(){
  $('#vUrb').setAttribute('aria-pressed', String(mapView==='urb')); $('#vAll').setAttribute('aria-pressed', String(mapView==='all'));
  const c = C(); $('#legDot').style.background = c.color;
  $('#mapSub').textContent = `${c.short} · cada círculo é uma escola; toque para ver os números`;
  if (typeof L === 'undefined'){ $('#map').replaceChildren(el('p',{class:'empty', text:'O mapa não pôde ser carregado agora. Use as abas Bairros e Escolas para ver os mesmos números.'})); return; }
  initMap(); setTimeout(() => map.invalidateSize(), 0);
  layer.clearLayers();
  const fill = cssColor(c.cssVar), ink = cssColor('--ink'), surf = cssColor('--surface');
  const locs = Object.values(LOC); const maxV = Math.max(...locs.map(l=>l[c.key])) || 1;
  for (const l of locs.sort((a,b)=>b[c.key]-a[c.key])){
    const r = 5 + Math.sqrt(l[c.key]/maxV) * 21; const sel = state.mapSel===l.code;
    const m = L.circleMarker([l.lat, l.lon], {radius:r, color: sel ? ink : surf, weight: sel ? 3 : 2, fillColor:fill, fillOpacity:.78, bubblingMouseEvents:false});
    m.bindTooltip(`${l.name}: ${nf.format(l[c.key])}`, {direction:'top', offset:[0,-r]});
    m.on('click', () => { state.mapSel = l.code; renderMap(); renderMapDetail(); $('#mapDetail').scrollIntoView({behavior:'smooth', block:'nearest'}); });
    m.addTo(layer);
  }
}
function fitMap(){ if (!map) return; if (mapView==='urb') map.fitBounds(URB, {padding:[10,10]}); else map.fitBounds(Object.values(LOC).map(l=>[l.lat,l.lon]), {padding:[24,24]}); }
function renderMapDetail(){
  const box = $('#mapDetail'); box.replaceChildren();
  if (!state.mapSel){ box.append(el('p',{class:'sub', text:'Toque em um círculo no mapa para ver a votação daquela escola.'})); return; }
  const l = LOC[state.mapSel];
  box.append(el('div',{class:'vh'}, el('h3',{text:l.name}), el('p',{class:'sub', text:`${l.bairro} · ${l.n} ${l.n>1?'seções':'seção'} · ${nf.format(l.comp)} eleitores presentes`})));
  box.append(miniRows(l), leadLine(l));
  const go = el('button',{class:'btn', type:'button', text:'Ver as seções desta escola'}); go.addEventListener('click', () => { state.sLocal = l.code; $('#sLocal').value = l.code; setView('secoes'); });
  box.style.cssText = 'display:flex;flex-direction:column;gap:12px'; box.append(go);
}

// listas
function itemCard({open, title, sub, big, small, pct, color, onToggle, body}){
  const it = el('div',{class:'item' + (open ? ' open' : '')});
  const bt = el('button',{type:'button','aria-expanded':String(open)});
  bt.append(el('span',{class:'t', text:title}), el('span',{class:'s', text:sub}), el('span',{class:'r'}, el('b',{text:big}), el('span',{text:small})));
  const bar = el('span',{class:'bar'}); const f = el('span',{class:'f'}); f.style.width = Math.max(1, 100*pct)+'%'; f.style.background = color; bar.append(f); bt.append(bar);
  bt.addEventListener('click', onToggle); it.append(bt);
  if (open){ const b = el('div',{class:'body'}); body(b); it.append(b); }
  return it;
}
function renderBairros(){
  const c = C(), box = $('#bList'); box.replaceChildren();
  const rows = Object.values(BAI).sort((a,b)=>b[c.key]/b.val - a[c.key]/a.val);
  const max = Math.max(...rows.map(b=>b[c.key]/b.val));
  $('#bSub').textContent = `${c.short} · % dos votos válidos, do maior para o menor`;
  for (const b of rows){
    box.append(itemCard({open: state.openB===b.name, title:b.name, sub:`${b.locs} ${b.locs>1?'escolas':'escola'} · ${rankIn(b,c.key)}º entre os ${NW} aqui`, big:pf(b[c.key]/b.val), small:`${nf.format(b[c.key])} votos`, pct:(b[c.key]/b.val)/max, color:c.color,
      onToggle:() => { state.openB = state.openB===b.name ? '' : b.name; renderBairros(); },
      body: x => { x.append(miniRows(b), leadLine(b)); const go = el('button',{class:'btn ghost', type:'button', text:'Ver as escolas deste bairro'}); go.addEventListener('click', () => { state.lBairro = b.name; $('#lBairro').value = b.name; setView('locais'); }); x.append(go); }}));
  }
}
function renderLocais(){
  const c = C(), box = $('#lList'); box.replaceChildren();
  let rows = Object.values(LOC).filter(l => !state.lBairro || l.bairro===state.lBairro);
  if (state.lSort==='v') rows.sort((a,b)=>b[c.key]-a[c.key]); else if (state.lSort==='p') rows.sort((a,b)=>b[c.key]/b.val-a[c.key]/a.val); else rows.sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  const metric = l => state.lSort==='p' ? l[c.key]/l.val : l[c.key];
  const max = Math.max(...Object.values(LOC).map(metric));
  for (const l of rows){
    box.append(itemCard({open: state.openL===l.code, title:l.name, sub:`${l.bairro} · ${l.n} ${l.n>1?'seções':'seção'}`, big:nf.format(l[c.key]), small:pf(l[c.key]/l.val), pct:metric(l)/max, color:c.color,
      onToggle:() => { state.openL = state.openL===l.code ? '' : l.code; renderLocais(); },
      body: x => { x.append(el('p',{class:'sub', text:`${l.end} · ${nf.format(l.comp)} eleitores presentes`}), miniRows(l), leadLine(l)); const go = el('button',{class:'btn', type:'button', text:'Ver as seções desta escola'}); go.addEventListener('click', () => { state.sLocal = l.code; $('#sLocal').value = l.code; setView('secoes'); }); x.append(go); }}));
  }
  if (!rows.length) box.append(el('p',{class:'empty', text:'Nenhuma escola neste bairro.'}));
}
function renderSecoes(){
  const c = C(), box = $('#sList'); box.replaceChildren();
  const q = state.sQ;
  const rows = SEC.filter(s => (!state.sLocal || s.loc===state.sLocal) && (!q || s.sec.includes(q) || s.sec===q.padStart(4,'0'))).sort((a,b)=>a.sec.localeCompare(b.sec));
  const max = Math.max(...SEC.map(s=>s[c.key])) || 1;
  const sum = rows.reduce((a,s)=>{ a.v += s[c.key]; a.val += s.val; return a; }, {v:0, val:0});
  $('#sCount').textContent = rows.length ? `${rows.length} ${rows.length>1?'seções':'seção'} · ${c.short}: ${nf.format(sum.v)} votos (${pf(sum.v/(sum.val||1))})` : '';
  for (const s of rows.slice(0, 400)){
    box.append(itemCard({open: state.openS===s.sec, title:`Seção ${s.sec}${s.sec==='0306' ? ' (inclui a 0354)' : ''}`, sub:s.locName, big:nf.format(s[c.key]), small:pf(s[c.key]/s.val), pct:s[c.key]/max, color:c.color,
      onToggle:() => { state.openS = state.openS===s.sec ? '' : s.sec; renderSecoes(); },
      body: x => { x.append(el('p',{class:'sub', text:`${s.bairro} · ${nf.format(s.comp)} eleitores presentes · ${nf.format(s.val)} votos válidos`}), miniRows(s), leadLine(s)); }}));
  }
  if (!rows.length) box.append(el('p',{class:'empty', text:'Nenhuma seção encontrada. Digite só o número, por exemplo 322.'}));
}

// navegação
function setView(v){ state.view = v; save(); try { history.replaceState(null,'','#'+v); } catch(e){} renderView(); window.scrollTo({top:0}); }
function renderView(){
  for (const v of VIEWS) $('#v-'+v).hidden = v!==state.view;
  for (const b of document.querySelectorAll('#tabs button')) { if (b.dataset.v===state.view) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); }
  if (state.view==='mapa'){ renderMap(); renderMapDetail(); }
  if (state.view==='bairros') renderBairros();
  if (state.view==='locais') renderLocais();
  if (state.view==='secoes') renderSecoes();
}
function renderAll(){ renderChips(); renderHero(); renderRank(); renderView(); }

// início
document.title = CFG.title;
$('#h1').textContent = CFG.h1; $('#h1sub').textContent = CFG.sub;
$('#otherLink').href = CFG.other.url; $('#otherT').textContent = CFG.other.title; $('#otherS').textContent = CFG.other.sub;
const notes = $('#notes'); notes.append(el('h3',{text:'Sobre os dados'}));
for (const t of CFG.notes) notes.append(el('p',{text:t}));
const src = el('p'); src.append(el('a',{href:'https://resultados.tse.jus.br/oficial/app/index.html', target:'_blank', rel:'noopener', text:'TSE · Portal de Resultados'}), document.createTextNode(' · '), el('a',{href:'https://dadosabertos.tse.jus.br/dataset/eleitorado-2026', target:'_blank', rel:'noopener', text:'TSE · Dados Abertos'}), document.createTextNode(' · Mapa: '), el('a',{href:'https://www.openstreetmap.org/copyright', target:'_blank', rel:'noopener', text:'© OpenStreetMap'})); notes.append(src);
for (const b of document.querySelectorAll('#tabs button')) b.addEventListener('click', () => setView(b.dataset.v));
$('#vUrb').addEventListener('click', () => { mapView='urb'; renderMap(); fitMap(); });
$('#vAll').addEventListener('click', () => { mapView='all'; renderMap(); fitMap(); });
for (const b of Object.values(BAI).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'))) $('#lBairro').append(el('option',{value:b.name, text:b.name}));
for (const l of Object.values(LOC).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'))) $('#sLocal').append(el('option',{value:l.code, text:l.name}));
$('#lSort').addEventListener('change', e => { state.lSort = e.target.value; renderLocais(); });
$('#lBairro').addEventListener('change', e => { state.lBairro = e.target.value; renderLocais(); });
$('#sLocal').addEventListener('change', e => { state.sLocal = e.target.value; state.openS=''; renderSecoes(); });
$('#sQ').addEventListener('input', e => { state.sQ = e.target.value.replace(/\D/g,''); renderSecoes(); });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state.view==='mapa') renderMap(); }); } catch(e){}
renderStrip('#stripSec','#legSec','#stripSecT', SEC, 'seção');
renderStrip('#stripLoc','#legLoc','#stripLocT', Object.values(LOC), 'escola');
renderAll();
</script>
